<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Trading Card (86x54mm)</title>
    <!-- A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- クロマキー（背景緑透明化） -->
    <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #start-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
        font-size: 18px;
        z-index: 99999;
        cursor: pointer;
      }
      #start-button {
        margin-top: 15px;
        padding: 12px 24px;
        background: #007aff;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 16px;
      }
    </style>
  </head>
  <body>

    <!-- iOSなどの自動再生制限を解除するためのタップ画面 -->
    <div id="start-overlay">
      <div>画面をタップしてARをスタート</div>
      <button id="start-button">カメラを起動する</button>
    </div>

    <!-- 最初にカメラが確実に映る標準のembedded構成 -->
    <a-scene 
      embedded
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="base-video" src="./base.mp4" preload="auto" loop crossorigin="anonymous" playsinline></video>
        <video id="effect-video" src="./effect.mp4" preload="auto" loop crossorigin="anonymous" playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- マーカー検出ターゲット -->
      <a-entity id="card-target" mindar-image-target="targetIndex: 0">
        
        <!-- 1. ベース動画（回転させず、縦型の比率 width=0.6279, height=1.0 に設定） -->
        <a-video 
          src="#base-video" 
          width="0.6279" 
          height="1.0" 
          position="0 0 0">
        </a-video>

        <!-- 2. 角丸マスク（縦型 54x86mm に合わせた角丸オーバーレイ） -->
        <a-plane 
          id="rounded-mask" 
          width="0.6299" 
          height="1.002" 
          position="0 0 0.005" 
          material="transparent: true; opacity: 1;">
        </a-plane>

        <!-- 3. エフェクト動画（緑背景クロマキー / 手前 position z=0.06 に浮遊） -->
        <a-video 
          src="#effect-video" 
          material="shader: chromakey; color: 0.1 0.9 0.1; chromakey: true" 
          width="0.785" 
          height="1.25" 
          position="0 0 0.06">
        </a-video>

      </a-entity>
    </a-scene>
