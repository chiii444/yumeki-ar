<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Trading Card (86x54mm)</title>
    <!-- A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- クロマキー（背景緑透明化） -->
    <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>

    <!-- ボタンを廃止し、アクセス直後に自動でAR（カメラ）が立ち上がる設定 -->
    <a-scene 
      embedded
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiError: yes;" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="base-video" src="./base.mp4" preload="auto" loop crossorigin="anonymous" playsinline></video>
        <video id="effect-video" src="./effect.mp4" preload="auto" loop crossorigin="anonymous" playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- マーカー検出ターゲット -->
      <a-entity id="card-target" mindar-image-target="targetIndex: 0">
        
        <!-- ベース動画（縦型サイズ） -->
        <a-video 
          src="#base-video" 
          width="0.6279" 
          height="1.0" 
          position="0 0 0">
        </a-video>

        <!-- 角丸マスク -->
        <a-plane 
          id="rounded-mask" 
          width="0.6299" 
          height="1.002" 
          position="0 0 0.005" 
          material="transparent: true; opacity: 1;">
        </a-plane>

        <!-- エフェクト動画（緑背景クロマキー） -->
        <a-video 
          src="#effect-video" 
          material="shader: chromakey; color: 0.1 0.9 0.1; chromakey: true" 
          width="0.785" 
          height="1.25" 
          position="0 0 0.06">
        </a-video>

      </a-entity>
    </a-scene>

    <script>
      // 角丸マスクの自動生成処理
      function createCornerMask() {
        const canvas = document.createElement('canvas');
        canvas.width = 540;
        canvas.height = 860;
        const ctx = canvas.getContext('2d');

        const w = canvas.width;
        const h = canvas.height;
        const r = w * (3 / 54);

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, w, h);

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.arcTo(w, 0, w, h, r);
        ctx.arcTo(w, h, 0, h, r);
        ctx.arcTo(0, h, 0, 0, r);
        ctx.arcTo(0, 0, w, 0, r);
        ctx.closePath();
        ctx.fill();

        const maskPlane = document.querySelector('#rounded-mask');
        if (maskPlane) {
          maskPlane.setAttribute('material', 'src', canvas.toDataURL());
        }
      }

      window.addEventListener('load', createCornerMask);

      // 動画の1秒遅延・同期再生制御
      const target = document.querySelector('#card-target');
      const baseVideo = document.querySelector('#base-video');
      const effectVideo = document.querySelector('#effect-video');
      
      let delayTimer = null;

      if (target) {
        target.addEventListener('targetFound', () => {
          delayTimer = setTimeout(() => {
            if (baseVideo) baseVideo.play();
            if (effectVideo) effectVideo.play();
          }, 1000);
        });

        target.addEventListener('targetLost', () => {
          if (delayTimer) {
            clearTimeout(delayTimer);
            delayTimer = null;
          }
          if (baseVideo) baseVideo.pause();
          if (effectVideo) effectVideo.pause();
        });
      }
    </script>
  </body>
</html>
