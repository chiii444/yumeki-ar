<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Trading Card (86x54mm)</title>
    <!-- A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- クロマキー（背景緑透明化） -->
    <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="base-video" src="./base.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="effect-video" src="./effect.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- マーカー検出ターゲット（縦型トレカサイズ: 54x86mm） -->
      <a-entity id="card-target" mindar-image-target="targetIndex: 0">
        
        <!-- 1. ベース動画 -->
        <a-video 
          src="#base-video" 
          width="0.6279" 
          height="1.0" 
          position="0 0 0">
        </a-video>

        <!-- 2. 角丸マスク -->
        <a-plane 
          id="rounded-mask" 
          width="0.6299" 
          height="1.002" 
          position="0 0 0.005" 
          material="transparent: true; opacity: 1;">
        </a-plane>

        <!-- 3. エフェクト動画（緑背景クロマキー） -->
        <a-video 
          src="#effect-video" 
          material="shader: chromakey; color: 0.1 0.9 0.1; chromakey: true" 
          width="0.785" 
          height="1.25" 
          position="0 0 0.06">
        </a-video>

      </a-entity>
    </a-scene>

    <script>
      // 角丸マスクの動的生成
      function createCornerMask() {
        const canvas = document.createElement('canvas');
        canvas.width = 540;
        canvas.height = 860;
        const ctx = canvas.getContext('2d');

        const w = canvas.width;
        const h = canvas.height;
        const r = w * (3 / 54);

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, w, h);

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.arcTo(w, 0, w, h, r);
        ctx.arcTo(w, h, 0, h, r);
        ctx.arcTo(0, h, 0, 0, r);
        ctx.arcTo(0, 0, w, 0, r);
        ctx.closePath();
        ctx.fill();

        const maskPlane = document.querySelector('#rounded-mask');
        if (maskPlane) {
          maskPlane.setAttribute('material', 'src', canvas.toDataURL());
        }
      }

      window.addEventListener('load', createCornerMask);

      // 動画の確実なロードと1秒遅延・同期再生制御
      const target = document.querySelector('#card-target');
      const baseVideo = document.querySelector('#base-video');
      const effectVideo = document.querySelector('#effect-video');
      
      let delayTimer = null;

      // ページ読み込み時に一度サイレント再生を試みてiOSの再生制限を強制解除
      window.addEventListener('load', () => {
        baseVideo.load();
        effectVideo.load();
      });

      if (target) {
        target.addEventListener('targetFound', () => {
          // 再生前に一度currentTimeを0に戻すことで黒画面でのフリーズを防ぐ
          baseVideo.currentTime = 0;
          effectVideo.currentTime = 0;

          delayTimer = setTimeout(() => {
            baseVideo.play().catch(e => console.log("Base play error:", e));
            effectVideo.play().catch(e => console.log("Effect play error:", e));
          }, 1000);
        });

        target.addEventListener('targetLost', () => {
          if (delayTimer) {
            clearTimeout(delayTimer);
            delayTimer = null;
          }
          baseVideo.pause();
          effectVideo.pause();
        });
      }
    </script>
  </body>
</html>
